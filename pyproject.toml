[project]
name = "horaris-extractor"
version = "0.1.0"
description = "Extractor SQLite + solver CP-SAT (OR-Tools) para el reto de horarios."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.10,<10",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.28,<1",
]

[project.scripts]
extractor = "extractor.__main__:main"
horaris-solver = "horaris_solver.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "extractor"
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "repte-horaris-escola",
    "backend",
    "frontend",
    "chatbot",
    "__MACOSX",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PLW1514"]
# PLW1514 (open sin encoding) es una regla preview: se activa solo ella, no el resto de preview.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.isort]
# Paquete propio declarado explícitamente: el orden de imports no depende de la caché ni de si el módulo ya existe.
known-first-party = ["extractor"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = [
    '^repte-horaris-escola/',
    '^\.venv/',
    '^\.agentic/',
    '^\.claude/',
    '^backend/',
    '^frontend/',
    '^chatbot/',
]

[[tool.mypy.overrides]]
module = ["ortools", "ortools.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "repte-horaris-escola", "backend", "frontend", "chatbot"]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]
