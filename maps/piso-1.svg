  <!-- Script interno para cuando se abre directamente en el navegador o mediante iframe/object -->
  <script type="text/javascript">
    <![CDATA[
    document.addEventListener('DOMContentLoaded', () => {
      const rooms = document.querySelectorAll('.room');
      rooms.forEach((room) => {
        const notifySelection = () => {
          rooms.forEach(r => r.classList.remove('is-selected'));
          room.classList.add('is-selected');
          const roomId = room.getAttribute('data-room') || room.id;
          
          // Emitir evento al DOM local
          const event = new CustomEvent('roomSelected', {
            bubbles: true,
            composed: true,
            detail: { roomId: roomId, floor: 1 }
          });
          room.dispatchEvent(event);

          // Comunicar a la ventana padre si está en un iframe u object
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'ROOM_SELECTED', roomId: roomId, floor: 1 }, '*');
            }
          } catch(e) {}
        };

        room.addEventListener('click', notifySelection);
        room.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            notifySelection();
          }
        });
      });
    });
    ]]>
  </script>
