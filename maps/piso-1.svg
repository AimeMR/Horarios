<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3500 2500" width="3500" height="2500">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .wall { fill: #FFFFFF; stroke: #111827; stroke-width: 4.5; stroke-linejoin: miter; stroke-linecap: square; }
      .room-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 23px; font-weight: 700; fill: #111827; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.5px; }
      .room-label-sm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16.5px; font-weight: 700; fill: #111827; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.3px; }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="3500" height="2500" class="bg" />

  <!-- ==================== COLUMNA / PASILLO VERTICAL OESTE ==================== -->
  <rect x="1150" y="100" width="280" height="1590" class="wall" />

  <!-- ==================== BLOQUE Q4 ==================== -->
  <g id="block-q4">
    <!-- Salas -->
    <rect x="1430" y="100" width="320" height="200" class="wall" />
    <text x="1590" y="200" class="room-label">Q4/0003</text>

    <rect x="1750" y="100" width="325" height="200" class="wall" />
    <text x="1912.5" y="200" class="room-label">Q4/0007</text>

    <rect x="2075" y="100" width="325" height="200" class="wall" />
    <text x="2237.5" y="200" class="room-label">Q4/0011</text>

    <!-- Pasillo inferior Q4 -->
    <rect x="1430" y="300" width="970" height="60" class="wall" />
  </g>

  <!-- ==================== BLOQUE Q3 ==================== -->
  <g id="block-q3">
    <!-- Salas -->
    <rect x="1430" y="480" width="270" height="200" class="wall" />
    <text x="1565" y="580" class="room-label">Q3/0003</text>

    <rect x="1700" y="480" width="420" height="200" class="wall" />
    <text x="1910" y="580" class="room-label">Q3/0007</text>

    <rect x="2120" y="480" width="280" height="200" class="wall" />
    <text x="2260" y="580" class="room-label">Q3/0011</text>

    <!-- Pasillo inferior Q3 -->
    <rect x="1430" y="680" width="970" height="60" class="wall" />
  </g>

  <!-- ==================== BLOQUE Q6 (ESTE SUPERIOR) ==================== -->
  <g id="block-q6">
    <!-- Estructura exterior -->
    <rect x="2400" y="680" width="980" height="240" class="wall" />
    <!-- Separador del espacio distribuidor izquierdo -->
    <line x1="2640" y1="680" x2="2640" y2="920" class="wall" />
    <!-- Sala Q6/0005 -->
    <text x="3010" y="800" class="room-label">Q6/0005</text>
  </g>

  <!-- ==================== BLOQUE Q2 ==================== -->
  <g id="block-q2">
    <!-- Salas -->
    <rect x="1430" y="920" width="200" height="200" class="wall" />
    <text x="1530" y="1020" class="room-label">Q2/0003</text>

    <rect x="1630" y="920" width="150" height="200" class="wall" />
    <text x="1705" y="1020" class="room-label-sm">Q2/0007</text>

    <rect x="1780" y="920" width="150" height="200" class="wall" />
    <text x="1855" y="1020" class="room-label-sm">Q2/0011</text>

    <rect x="1930" y="920" width="150" height="200" class="wall" />
    <text x="2005" y="1020" class="room-label-sm">Q2/0013</text>

    <rect x="2080" y="920" width="150" height="200" class="wall" />
    <text x="2155" y="1020" class="room-label-sm">Q2/0017</text>

    <rect x="2230" y="920" width="170" height="200" class="wall" />
    <text x="2315" y="1020" class="room-label-sm">Q2/0019</text>

    <!-- Pasillo inferior Q2 -->
    <rect x="1430" y="1120" width="970" height="60" class="wall" />
  </g>

  <!-- ==================== BLOQUE Q5 (ESTE INFERIOR) ==================== -->
  <g id="block-q5">
    <!-- Distribuidor izquierdo abierto -->
    <rect x="2400" y="1120" width="240" height="240" class="wall" />

    <!-- Sala Q5/0003 -->
    <rect x="2640" y="1120" width="370" height="180" class="wall" />
    <text x="2825" y="1210" class="room-label">Q5/0003</text>

    <!-- Pasillo inferior bajo Q5/0003 -->
    <rect x="2640" y="1300" width="370" height="60" class="wall" />

    <!-- Sala Q5/0004 (altura completa) -->
    <rect x="3010" y="1120" width="370" height="240" class="wall" />
    <text x="3195" y="1240" class="room-label">Q5/0004</text>
  </g>

  <!-- ==================== BLOQUE Q1 ==================== -->
  <g id="block-q1">
    <!-- Salas -->
    <rect x="1430" y="1360" width="290" height="200" class="wall" />
    <text x="1575" y="1460" class="room-label">Q1/0003</text>

    <rect x="1720" y="1360" width="280" height="200" class="wall" />
    <text x="1860" y="1460" class="room-label">Q1/0005</text>

    <!-- Espacio / Distribuidor abierto (2000 a 2110) -->

    <rect x="2110" y="1360" width="290" height="200" class="wall" />
    <text x="2255" y="1460" class="room-label">Q1/0019</text>

    <!-- Pasillo inferior Q1 -->
    <rect x="1430" y="1560" width="970" height="60" class="wall" />
  </g>

  <!-- ==================== ALA SUR / PASILLO PRINCIPAL QC ==================== -->
  <g id="block-qc">
    <!-- Contenedor exterior del corredor principal QC -->
    <rect x="100" y="1690" width="3280" height="600" class="wall" />

    <!-- Fila Norte de Salas QC -->
    <rect x="1430" y="1690" width="230" height="180" class="wall" />
    <text x="1545" y="1780" class="room-label">QC/0011</text>

    <rect x="1710" y="1690" width="160" height="180" class="wall" />
    <text x="1790" y="1780" class="room-label">QC/0019</text>

    <rect x="1920" y="1690" width="160" height="180" class="wall" />
    <text x="2000" y="1780" class="room-label">QC/0067</text>

    <rect x="2080" y="1690" width="150" height="180" class="wall" />
    <text x="2155" y="1780" class="room-label">QC/0075</text>

    <rect x="2230" y="1690" width="100" height="180" class="wall" />
    <text x="2280" y="1780" class="room-label-sm">QC/0081</text>

    <rect x="2330" y="1690" width="150" height="180" class="wall" />
    <text x="2405" y="1780" class="room-label">QC/0085</text>

    <rect x="2480" y="1690" width="150" height="180" class="wall" />
    <text x="2555" y="1780" class="room-label">QC/0089</text>

    <rect x="2630" y="1690" width="100" height="180" class="wall" />
    <text x="2680" y="1780" class="room-label-sm">QC/0091</text>

    <!-- Espacio / Paso abierto (2730 a 2780) -->

    <rect x="2780" y="1690" width="160" height="180" class="wall" />
    <text x="2860" y="1780" class="room-label">QC/0107</text>

    <rect x="2940" y="1690" width="150" height="180" class="wall" />
    <text x="3015" y="1780" class="room-label">QC/0109</text>

    <!-- Sala Este QC/0113 (altura completa del ala) -->
    <rect x="3240" y="1690" width="140" height="600" class="wall" />
    <text x="3310" y="1990" class="room-label-sm">QC/0113</text>

    <!-- Fila Sur de Salas QC -->
    <rect x="1920" y="2110" width="160" height="180" class="wall" />
    <text x="2000" y="2200" class="room-label">QC/0069</text>

    <rect x="2080" y="2110" width="100" height="180" class="wall" />
    <text x="2130" y="2200" class="room-label-sm">QC/0073</text>

    <rect x="2180" y="2110" width="100" height="180" class="wall" />
    <text x="2230" y="2200" class="room-label-sm">QC/0077</text>

    <rect x="2280" y="2110" width="160" height="180" class="wall" />
    <text x="2360" y="2200" class="room-label">QC/0079</text>

    <rect x="2440" y="2110" width="160" height="180" class="wall" />
    <text x="2520" y="2200" class="room-label">QC/0083</text>

    <rect x="2600" y="2110" width="160" height="180" class="wall" />
    <text x="2680" y="2200" class="room-label">QC/0087</text>

    <!-- Espacio / Paso abierto (2760 a 3010) -->

    <rect x="3010" y="2110" width="210" height="180" class="wall" />
    <text x="3115" y="2200" class="room-label">QC/0111</text>
  </g>
</svg>