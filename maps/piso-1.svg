<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3500 2500" width="3500" height="2500" id="svg-floor-1">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .wall { fill: #FFFFFF; stroke: #111827; stroke-width: 4.5; stroke-linejoin: miter; stroke-linecap: square; }
      .wall-thick { fill: #FFFFFF; stroke: #111827; stroke-width: 5.5; stroke-linejoin: miter; stroke-linecap: square; }
      .corridor-bound { fill: none; stroke: #111827; stroke-width: 4.5; stroke-linejoin: miter; stroke-linecap: square; }
      .room-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.5px; pointer-events: none; user-select: none; }
      .room-label-vert { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #111827; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.5px; pointer-events: none; user-select: none; }
      .corridor-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #6B7280; text-anchor: middle; dominant-baseline: central; letter-spacing: 4px; pointer-events: none; user-select: none; }
      .entry-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; letter-spacing: 2px; pointer-events: none; user-select: none; }
      .arrow { stroke: #111827; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }

      /* ==========================================
         ESTILOS DE INTERACTIVIDAD (CLICKABLE BLOCKS)
         ========================================== */
      .room {
        cursor: pointer;
        outline: none;
      }
      .room rect,
      .room-clickable {
        cursor: pointer;
        transition: fill 0.18s ease, stroke 0.18s ease, stroke-width 0.18s ease;
      }
      .room:hover rect,
      .room:focus-visible rect,
      .room-clickable:hover {
        fill: #E0F2FE !important;
        stroke: #0284C7 !important;
        stroke-width: 6 !important;
      }
      .room:hover text,
      .room:focus-visible text {
        fill: #0284C7 !important;
      }
      .room.is-selected rect,
      .room-clickable.is-selected {
        fill: #BAE6FD !important;
        stroke: #0369A1 !important;
        stroke-width: 7 !important;
      }
      .room.is-selected text {
        fill: #0369A1 !important;
      }
    </style>
