<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3500 2500" width="3500" height="2500">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .wall { fill: #FFFFFF; stroke: #111827; stroke-width: 4.5; stroke-linejoin: miter; stroke-linecap: square; }
      .grey-wing { fill: #A3A3A3; stroke: #111827; stroke-width: 4.5; stroke-linejoin: miter; stroke-linecap: square; }
      .room-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.5px; }
      .room-label-sm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #111827; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.3px; }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="3500" height="2500" class="bg" />

  <!-- ==================== BLOQUES GRISES (ALA OESTE Y ALAS PRINCIPALES) ==================== -->
  <!-- Columna / Pasillo vertical conector -->
  <rect x="1200" y="120" width="280" height="1540" class="grey-wing" />

  <!-- Ala 4 (Superior) -->
  <rect x="1480" y="120" width="940" height="260" class="grey-wing" />

  <!-- Ala 3 -->
  <rect x="1480" y="470" width="940" height="260" class="grey-wing" />

  <!-- Ala 2 -->
  <rect x="1480" y="920" width="940" height="260" class="grey-wing" />

  <!-- Ala 1 -->
  <rect x="1480" y="1370" width="940" height="260" class="grey-wing" />

  <!-- ==================== BLOQUE Q6 (ESTE SUPERIOR) ==================== -->
  <g id="block-q6">
    <!-- Salas -->
    <rect x="2420" y="730" width="240" height="210" class="wall" />
    <text x="2540" y="835" class="room-label">Q6/2004</text>

    <rect x="2660" y="730" width="240" height="210" class="wall" />
    <text x="2780" y="835" class="room-label">Q6/2005</text>

    <rect x="2900" y="730" width="150" height="210" class="wall" />
    <text x="2975" y="835" class="room-label-sm">Q6/2007</text>

    <rect x="3050" y="730" width="160" height="210" class="wall" />
    <text x="3130" y="835" class="room-label-sm">Q6/2008</text>

    <rect x="3210" y="730" width="170" height="210" class="wall" />
    <text x="3295" y="835" class="room-label-sm">Q6/2009</text>

    <!-- Pasillo inferior Q6 -->
    <rect x="2420" y="940" width="960" height="70" class="wall" />
  </g>

  <!-- ==================== BLOQUE Q5 (ESTE INFERIOR) ==================== -->
  <g id="block-q5">
    <!-- Salas -->
    <rect x="2420" y="1180" width="240" height="210" class="wall" />
    <text x="2540" y="1285" class="room-label">Q5/2003</text>

    <rect x="2660" y="1180" width="170" height="210" class="wall" />
    <text x="2745" y="1285" class="room-label-sm">Q5/2006</text>

    <rect x="2830" y="1180" width="180" height="210" class="wall" />
    <text x="2920" y="1285" class="room-label-sm">Q5/2007</text>

    <rect x="3010" y="1180" width="170" height="210" class="wall" />
    <text x="3095" y="1285" class="room-label-sm">Q5/2008</text>

    <rect x="3180" y="1180" width="200" height="210" class="wall" />
    <text x="3280" y="1285" class="room-label-sm">Q5/2009</text>

    <!-- Pasillo inferior Q5 -->
    <rect x="2420" y="1390" width="960" height="70" class="wall" />
  </g>

  <!-- ==================== ALA SUR / PASILLO PRINCIPAL QC ==================== -->
  <g id="block-qc">
    <!-- Contenedor exterior del corredor QC -->
    <rect x="150" y="1660" width="3230" height="600" class="wall" />

    <!-- QC/2090 (Extremo Oeste - Sala vertical de altura completa) -->
    <rect x="150" y="1660" width="350" height="600" class="wall" />
    <text x="325" y="1960" class="room-label">QC/2090</text>

    <!-- QC/2080 (Pared Norte Oeste) -->
    <rect x="500" y="1660" width="350" height="200" class="wall" />
    <text x="675" y="1760" class="room-label">QC/2080</text>

    <!-- QC/2082 (Pared Sur Oeste) -->
    <rect x="500" y="2060" width="350" height="200" class="wall" />
    <text x="675" y="2160" class="room-label">QC/2082</text>

    <!-- QC/2004 (Pared Sur Central-Oeste) -->
    <rect x="1400" y="2060" width="350" height="200" class="wall" />
    <text x="1575" y="2160" class="room-label">QC/2004</text>

    <!-- QC/2011 & QC/2015 (Pared Sur Centro) -->
    <rect x="1930" y="2060" width="180" height="200" class="wall" />
    <text x="2020" y="2160" class="room-label-sm">QC/2011</text>

    <rect x="2110" y="2060" width="180" height="200" class="wall" />
    <text x="2200" y="2160" class="room-label-sm">QC/2015</text>

    <!-- QC/2101 (Pared Norte Centro-Este) -->
    <rect x="2490" y="1660" width="180" height="200" class="wall" />
    <text x="2580" y="1760" class="room-label-sm">QC/2101</text>

    <!-- QC/2099 (Pared Sur Centro-Este) -->
    <rect x="2490" y="2060" width="180" height="200" class="wall" />
    <text x="2580" y="2160" class="room-label-sm">QC/2099</text>

    <!-- Fila Norte Este: QC/2149, QC/2161, QC/2165 -->
    <rect x="2800" y="1660" width="280" height="200" class="wall" />
    <text x="2940" y="1760" class="room-label">QC/2149</text>

    <rect x="3080" y="1660" width="150" height="200" class="wall" />
    <text x="3155" y="1760" class="room-label-sm">QC/2161</text>

    <rect x="3230" y="1660" width="150" height="200" class="wall" />
    <text x="3305" y="1760" class="room-label-sm">QC/2165</text>

    <!-- Fila Sur Este: QC/2147, QC/2159 -->
    <rect x="2800" y="2060" width="290" height="200" class="wall" />
    <text x="2945" y="2160" class="room-label">QC/2147</text>

    <rect x="3090" y="2060" width="290" height="200" class="wall" />
    <text x="3235" y="2160" class="room-label">QC/2159</text>
  </g>
</svg>