<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3500 2500" width="3500" height="2500">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .wall { fill: #FFFFFF; stroke: #111827; stroke-width: 4.5; stroke-linejoin: miter; stroke-linecap: square; }
      .grey-wing { fill: #A3A3A3; stroke: #111827; stroke-width: 4.5; stroke-linejoin: miter; stroke-linecap: square; }
      .room-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="3500" height="2500" class="bg" />

  <!-- ==================== BLOQUES GRISES (ALA OESTE Y ALAS PRINCIPALES) ==================== -->
  <!-- Columna / Pasillo vertical conector -->
  <rect x="1200" y="120" width="280" height="1540" class="grey-wing" />

  <!-- Ala 4 (Superior) -->
  <rect x="1480" y="120" width="940" height="260" class="grey-wing" />

  <!-- Ala 3 -->
  <rect x="1480" y="470" width="940" height="260" class="grey-wing" />

  <!-- Ala Este Superior -->
  <rect x="2420" y="730" width="960" height="260" class="grey-wing" />

  <!-- Ala 2 -->
  <rect x="1480" y="920" width="940" height="260" class="grey-wing" />

  <!-- Ala Este Inferior -->
  <rect x="2420" y="1180" width="960" height="260" class="grey-wing" />

  <!-- Ala 1 -->
  <rect x="1480" y="1370" width="940" height="260" class="grey-wing" />

  <!-- ==================== ALA SUR / PASILLO PRINCIPAL QC ==================== -->
  <g id="block-qc">
    <!-- Contenedor exterior del corredor QC -->
    <rect x="150" y="1660" width="3230" height="600" class="wall" />

    <!-- QC/3088 (Extremo Oeste - Sala de altura completa) -->
    <rect x="150" y="1660" width="350" height="600" class="wall" />
    <text x="325" y="1960" class="room-label">QC/3088</text>

    <!-- QC/3078 (Pared Sur Oeste) -->
    <rect x="670" y="2060" width="200" height="200" class="wall" />
    <text x="770" y="2160" class="room-label">QC/3078</text>

    <!-- QC/3042 (Pared Norte Centro-Oeste) -->
    <rect x="1160" y="1660" width="200" height="200" class="wall" />
    <text x="1260" y="1760" class="room-label">QC/3042</text>

    <!-- QC/3010 (Pared Norte en el nexo vertical) -->
    <rect x="1480" y="1660" width="200" height="200" class="wall" />
    <text x="1580" y="1760" class="room-label">QC/3010</text>

    <!-- QC/3012 (Pared Sur opuesta a QC/3010) -->
    <rect x="1480" y="2060" width="200" height="200" class="wall" />
    <text x="1580" y="2160" class="room-label">QC/3012</text>

    <!-- QC/3047 (Pared Norte Centro-Este) -->
    <rect x="2220" y="1660" width="200" height="200" class="wall" />
    <text x="2320" y="1760" class="room-label">QC/3047</text>

    <!-- QC/3049 (Pared Sur Centro-Este) -->
    <rect x="2320" y="2060" width="200" height="200" class="wall" />
    <text x="2420" y="2160" class="room-label">QC/3049</text>
  </g>
</svg>